<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A living calendar of the day’s most consequential news, sourced from original reporting.">
  <title>Daily News Calendar</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <header class="hero">
      <div>
        <p class="eyebrow">A living archive</p>
        <h1 class="title">Daily News<br>Calendar</h1>
      </div>
      <p class="intro">A calm, carefully sourced record of the stories that shaped each day. Select any highlighted date to read its brief.</p>
    </header>

    <section class="calendar-shell" aria-labelledby="month-title">
      <div class="calendar-top">
        <div>
          <h2 id="month-title" class="month">Loading calendar</h2>
          <span id="month-subtitle" class="month-subtitle"></span>
        </div>
        <div class="month-controls" aria-label="Calendar navigation">
          <button id="previous-month" type="button" aria-label="Previous month">←</button>
          <button id="next-month" type="button" aria-label="Next month">→</button>
        </div>
      </div>
      <div class="calendar" id="calendar"></div>
    </section>

    <article class="story" id="selected-story" aria-live="polite"></article>
    <footer>One notable story per day · Links lead to the original source · Updated daily</footer>
  </main>
  <script src="main.js"></script>
</body>
</html>
